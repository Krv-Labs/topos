[package]
name = "topos-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Topos MCP server: SIMPLE/COMPOSABLE/SECURE/NAVIGABLE structural code-quality tools over the Model Context Protocol (stdio)."

[dependencies]
topos-engine = { path = "../engine" }
# Bounded to 3.1.x: rmcp changed `initialize` version negotiation in a *minor*
# release (3.1.0), so a looser `"3"` lets protocol behavior move with no diff.
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
# Real semver precedence for the update check. Zero dependencies. The hand-rolled
# comparator in `gitnexus.rs` drops pre-release suffixes, so it cannot order
# `0.7.1-rc.1` against `0.7.0` — exactly the question the check asks.
semver = "1.0"
tempfile = "3"
# Unified diff for the regression-diff on an assessment (difflib parity).
similar = "2"
# Embedded SAST engine (MIT) — replaces the former external `sighthound`
# CLI dependency; pinned for reproducible builds.
sighthound = { git = "https://github.com/Corgea/Sighthound", rev = "36dd5da663f826d81f1a444c474935b6acbf285c" }

[dev-dependencies]
# `tests/lifecycle.rs` parses the JSON-RPC frames the stdio server writes back.
# Integration tests do not inherit `[dependencies]`, hence the restatement.
serde_json = "1.0"
# Builds a throwaway Ladybug store for the dep-graph cache tests; pinned to
# the engine's version so no second copy is compiled.
lbug = "=0.17.1"
