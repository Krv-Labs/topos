name: Self badge

on:
  push:
    branches: [main]
    paths:
      - "topos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/badge.yml"
  pull_request:
    branches: [main]
    paths:
      - "topos/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/badge.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: badge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  badge:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps (lbug / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache lbug prebuilt
        uses: actions/cache@v4
        with:
          path: ~/.cargo/lbug-prebuilt
          key: lbug-prebuilt-0.17.1-static-${{ runner.os }}-${{ runner.arch }}

      - name: Setup lbug prebuilt
        run: ./scripts/setup-lbug-prebuilt.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install pinned GitNexus
        run: npm install -g gitnexus@1.6.8

      - name: Build topos CLI
        run: cargo build --release -p topos

      - name: Index repo for COMPOSABLE scoring
        run: gitnexus analyze --skip-agents-md

      - name: Generate self badge
        run: |
          set -euo pipefail
          ./target/release/topos badge topos/cli topos/engine topos/mcp \
            --out docs/source/_static/topos-badge.svg \
            --endpoint docs/source/_static/topos-badge.json

      - name: Print badge report
        run: |
          echo "=== Badge endpoint ==="
          cat docs/source/_static/topos-badge.json
          echo ""
          echo "=== Badge SVG ==="
          cat docs/source/_static/topos-badge.svg

      # main only takes changes through a pull request, so a direct `git push`
      # was rejected every time the badge changed. Open (or update) one bot PR
      # instead; nothing is opened when the badge is unchanged.
      - name: Open badge refresh pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            docs/source/_static/topos-badge.svg
            docs/source/_static/topos-badge.json
          branch: bot/self-badge
          delete-branch: true
          commit-message: "chore: refresh README self-badge"
          title: "chore: refresh README self-badge"
          body: |
            Automated refresh of the README self-badge, generated by `topos badge` in the Self badge workflow after changes landed on main.

            Only `docs/source/_static/topos-badge.svg` and `topos-badge.json` change. Merge when convenient; a later refresh updates this PR instead of opening another.
