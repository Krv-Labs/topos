[package]
name = "topos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust CLI for Topos structural code quality evaluation (binary name: topos)."

[[bin]]
name = "topos"
path = "src/main.rs"

[dependencies]
topos-engine = { path = "../engine" }
# The `topos mcp` subcommand launches the in-process Rust MCP server, so the
# `topos` binary bundles the same server the standalone `topos-mcp` binary
# exposes (the VS Code extension invokes `topos mcp`).
topos-mcp = { path = "../mcp" }
tokio = { version = "1", features = ["rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
# Already a topos-engine dependency; used here for --json output.
# `preserve_order` keeps harness config keys in their original order when
# `topos install` merges an MCP entry — without it every key in a user's
# `~/.claude.json` is alphabetically re-sorted on write. It has to be declared
# here rather than inherited: `resolver = "2"` keeps tree-sitter's
# build-dependency copy from unifying the feature.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Already present transitively through the MCP stack; used directly for
# terminal progress and the lightweight interactive config selector.
indicatif = "0.17.11"
console = "0.15.11"
# Preserve comments and unrelated settings when updating `.topos.toml`.
toml_edit = "0.22.27"
