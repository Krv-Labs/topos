name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (v0.1.0 or 0.1.0; normalized to v*)"
        required: true
      pypi_only:
        description: "Publish only PyPI artifacts"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Fail fast when a release tag (or workflow_dispatch version) does not match
  # Cargo.toml — maturin/PyPI take the workspace version, while GitHub Release
  # + Homebrew take the git tag. See #217.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check published metadata vs Cargo.toml
        run: python3 scripts/check_versions.py

      - name: Check release tag matches Cargo.toml
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          python3 scripts/check_versions.py --tag "$RAW"

  # ---- Native `topos` binary (includes `topos mcp`) per platform -----------
  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pypi_only) }}
    needs:
      - verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-lbug-prebuilt
          cache-on-failure: false

      - name: Cache lbug prebuilt
        uses: actions/cache@v4
        with:
          path: ~/.cargo/lbug-prebuilt
          key: lbug-prebuilt-0.17.1-static-${{ runner.os }}-${{ runner.arch }}

      - name: Setup lbug prebuilt
        run: ./scripts/setup-lbug-prebuilt.sh

      - name: Build release binary
        run: cargo build --release -p topos

      - name: Stage binary with platform suffix
        run: |
          mkdir -p dist
          cp target/release/topos "dist/topos-${{ matrix.target }}"

      # Runs before signing so a non-portable artifact can never be signed or
      # notarized. v0.4.1 shipped a macOS binary that linked Homebrew's
      # openssl@3 at an absolute path; under the hardened runtime dyld refused
      # to map a dylib with a different Team ID and every `topos` invocation
      # aborted. Linux escaped only because the Debian/Ubuntu toolchain passes
      # --as-needed by default (GNU ld itself defaults to --no-as-needed), so
      # the unused library was dropped. That is a distro default, not a
      # guarantee, so Linux is checked too.
      - name: Verify binary has no non-system dynamic linkage (macOS)
        if: runner.os == 'macOS'
        run: |
          BINARY_PATH="dist/topos-${{ matrix.target }}"
          bad="$(otool -L "${BINARY_PATH}" | tail -n +2 \
            | grep -vE '^[[:space:]]+(/usr/lib/|/System/)' || true)"
          if [ -n "${bad}" ]; then
            echo "::error title=Non-portable macOS binary::links non-system libraries"
            echo "${bad}"
            exit 1
          fi
          otool -L "${BINARY_PATH}"

      - name: Verify binary has no unexpected dynamic linkage (Linux)
        if: runner.os == 'Linux'
        run: |
          BINARY_PATH="dist/topos-${{ matrix.target }}"
          # ld-linux-*.so (the dynamic loader) is itself a DT_NEEDED entry on
          # both amd64 and arm64, so it must be allowlisted or every Linux
          # release build fails. glibc 2.34+ folds dl/pthread/rt into libc;
          # they are listed anyway for older toolchains.
          bad="$(readelf -d "${BINARY_PATH}" \
            | grep 'NEEDED' \
            | grep -vE 'lib(c|m|dl|pthread|rt|gcc_s|stdc\+\+)\.so|ld-linux-[a-z0-9_-]*\.so' || true)"
          if [ -n "${bad}" ]; then
            echo "::error title=Non-portable Linux binary::unexpected DT_NEEDED entries"
            echo "${bad}"
            exit 1
          fi
          readelf -d "${BINARY_PATH}" | grep 'NEEDED'

      # Static linkage checks cannot prove the loader is satisfied, so also
      # execute the artifact. Pre-signing this catches an outright missing
      # dylib; it cannot catch a Team ID mismatch, because library validation
      # is only enforced once the hardened runtime flag is signed in.
      - name: Smoke test staged binary
        run: |
          BINARY_PATH="dist/topos-${{ matrix.target }}"
          chmod +x "${BINARY_PATH}"
          "${BINARY_PATH}" --version

      - name: Prepare macOS code signing keychain
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE_P12_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::warning title=Unsigned macOS binary::Apple signing secrets are missing. Continuing with an unsigned macOS binary; Gatekeeper may block it for users."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/topos-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "CODESIGN_IDENTITY=${CODESIGN_IDENTITY}" >> "$GITHUB_ENV"

      - name: Sign macOS binary
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
        run: |
          if [ -z "${CODESIGN_IDENTITY:-}" ]; then
            exit 0
          fi
          BINARY_PATH="dist/topos-${{ matrix.target }}"
          # A pure Rust binary needs only the hardened runtime — no JIT /
          # unsigned-executable-memory entitlements (those were for the old
          # PyInstaller/CPython bundle).
          codesign --force --options runtime --timestamp \
            --sign "$CODESIGN_IDENTITY" "${BINARY_PATH}"
          codesign --verify --strict --verbose=2 "${BINARY_PATH}"

      # The check that would have caught v0.4.1. The hardened runtime implies
      # library validation, so only the *signed* binary refuses to map a dylib
      # with a foreign Team ID — and notarization does not detect broken dylib
      # dependencies, they surface at runtime. Run it here, before notarizing,
      # so a binary that cannot start never reaches Apple or the release.
      - name: Smoke test signed macOS binary (library validation)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          BINARY_PATH="dist/topos-${{ matrix.target }}"
          if ! "${BINARY_PATH}" --version; then
            echo "::error title=Signed binary cannot start::hardened-runtime library validation rejected a linked dylib"
            otool -L "${BINARY_PATH}"
            exit 1
          fi

      - name: Notarize macOS binary archive
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "::warning title=Unnotarized macOS binary::Apple notarization secrets are missing. Continuing without notarization; Gatekeeper may block it for users."
            exit 0
          fi
          BINARY_PATH="dist/topos-${{ matrix.target }}"
          ARCHIVE_NAME="topos-${{ matrix.target }}"
          ditto -c -k --keepParent "${BINARY_PATH}" "$RUNNER_TEMP/${ARCHIVE_NAME}.zip"
          xcrun notarytool submit "$RUNNER_TEMP/${ARCHIVE_NAME}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: topos-${{ matrix.target }}
          path: dist/topos-${{ matrix.target }}

  package-vscode:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: linux-x64
            artifact: topos-linux-amd64
          - vscode_target: linux-arm64
            artifact: topos-linux-arm64
          - vscode_target: darwin-arm64
            artifact: topos-macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/vscode/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile

      - name: Download runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Package VS Code extension
        working-directory: extensions/vscode
        run: pnpm run package:${{ matrix.vscode_target }}

      - name: Check VSIX size
        working-directory: extensions/vscode
        run: node scripts/check-vsix-size.js topos-vscode-${{ matrix.vscode_target }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: topos-vscode-${{ matrix.vscode_target }}
          path: extensions/vscode/topos-vscode-${{ matrix.vscode_target }}.vsix

  release:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.pypi_only) }}
    needs:
      - verify-version
      - build
      - package-vscode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          # Accept 0.1.0 or v0.1.0; release tags and formula URLs always use v*.
          VERSION="v${RAW#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create checksums
        run: |
          cd dist
          sha256sum topos-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/topos-*
            dist/topos-vscode-*
            dist/checksums.txt
          generate_release_notes: true

  publish-homebrew:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.pypi_only) }}
    needs:
      - verify-version
      - release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          # Accept 0.1.0 or v0.1.0; release tags and formula URLs always use v*.
          VERSION="v${RAW#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.VERSION }}
          # gh talks to the tap repo with the dedicated PAT (not GITHUB_TOKEN).
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning title=Homebrew formula not published::HOMEBREW_TAP_TOKEN secret is missing. Skipping Homebrew tap update for ${TAG}."
            exit 0
          fi

          VERSION="${TAG#v}"
          BRANCH="bot/topos-${VERSION}"
          TAP_REPO="Krv-Labs/homebrew-tap"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github.com/Krv-Labs/topos/releases/download/${TAG}/checksums.txt" \
            -o checksums.txt

          sha_for() {
            sha=$(awk -v asset="$1" '$2 == asset { print $1 }' checksums.txt)
            if [ -z "$sha" ]; then
              echo "Missing checksum for $1 in checksums.txt" >&2
              exit 1
            fi
            echo "$sha"
          }

          SHA_MACOS_ARM64=$(sha_for topos-macos-arm64)
          SHA_LINUX_AMD64=$(sha_for topos-linux-amd64)
          SHA_LINUX_ARM64=$(sha_for topos-linux-arm64)

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{SHA_MACOS_ARM64}}/${SHA_MACOS_ARM64}/g" \
            -e "s/{{SHA_LINUX_AMD64}}/${SHA_LINUX_AMD64}/g" \
            -e "s/{{SHA_LINUX_ARM64}}/${SHA_LINUX_ARM64}/g" \
            packaging/homebrew/topos.rb.template > topos.rb

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" homebrew-tap
          mkdir -p homebrew-tap/Formula
          cp topos.rb homebrew-tap/Formula/topos.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add Formula/topos.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged for ${VERSION}; nothing to publish."
            exit 0
          fi

          git commit -m "topos ${VERSION}"
          # Open/update a PR so tap CI (style/audit/fetch/test-bot) gates the
          # formula bump instead of pushing straight to main.
          git push -u origin "${BRANCH}" --force

          PR_URL=$(gh pr list --repo "${TAP_REPO}" --head "${BRANCH}" --state open --json url --jq '.[0].url // empty')
          if [ -z "${PR_URL}" ]; then
            PR_BODY="Automated formula bump for topos ${VERSION}. Rendered from packaging/homebrew/topos.rb.template in Krv-Labs/topos after GitHub release assets were published. Tap CI should verify style, audit, multi-platform fetch, install, and brew test."
            PR_URL=$(gh pr create --repo "${TAP_REPO}" \
              --base main \
              --head "${BRANCH}" \
              --title "topos ${VERSION}" \
              --body "${PR_BODY}")
          fi

          echo "Homebrew tap PR: ${PR_URL}"

          # Best-effort: enable auto-merge when the repo allows it. Merge still
          # waits on required checks; failure here must not fail the release.
          if ! gh pr merge --repo "${TAP_REPO}" --auto --squash "${PR_URL}"; then
            echo "::notice title=Homebrew tap PR opened::Auto-merge not enabled or unavailable for ${PR_URL}. Merge after CI is green."
          fi

  publish-vscode-marketplace:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.pypi_only) }}
    needs:
      - package-vscode
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: topos-vscode-*
          merge-multiple: true

      - name: Publish VS Code Marketplace packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is required to publish VS Code Marketplace packages."
            exit 1
          fi

          # --skip-duplicate exits 0 when version+target already exists
          # (reruns after partial publish/timeout). Surface skip vs publish
          # as Actions notices + job summary so reviewers see it in the UI.
          # vsce messages (3.9.2): "already published. Skipping publish."
          # / "Published ${description}."
          published=0
          skipped=0
          {
            echo "## VS Code Marketplace"
            echo ""
            echo "| VSIX | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for vsix in dist/topos-vscode-darwin-arm64.vsix dist/topos-vscode-linux-arm64.vsix dist/topos-vscode-linux-x64.vsix; do
            name="$(basename "$vsix")"
            echo "::group::Publish ${name}"
            log="$(mktemp)"
            set +e
            npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate --packagePath "$vsix" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error title=VSCE publish failed::${name} (exit ${status})"
              echo "| \`${name}\` | failed (exit ${status}) |" >> "$GITHUB_STEP_SUMMARY"
              exit "$status"
            fi

            if grep -q 'already published\. Skipping publish\.' "$log"; then
              skipped=$((skipped + 1))
              echo "::notice title=VSCE skipped (already on Marketplace)::${name}"
              echo "| \`${name}\` | skipped (already published) |" >> "$GITHUB_STEP_SUMMARY"
            elif grep -q 'Published ' "$log"; then
              published=$((published + 1))
              echo "::notice title=VSCE published::${name}"
              echo "| \`${name}\` | published |" >> "$GITHUB_STEP_SUMMARY"
            else
              # --skip-duplicate succeeded but output did not match known
              # strings — do not hide that from reviewers.
              echo "::warning title=VSCE outcome unclear::${name}: publish exited 0 without a known success/skip line"
              echo "| \`${name}\` | unknown (exit 0, unmatched log) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          {
            echo ""
            echo "**Summary:** ${published} published, ${skipped} skipped as duplicate."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=VSCE Marketplace summary::${published} published, ${skipped} skipped as duplicate"

  # ---- PyPI: thin `bin` wheels wrapping the topos-mcp server binary --------
  build-pypi-wheels:
    needs:
      - verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux 2_34 (AlmaLinux 9) for a modern glibc/toolchain. lbug
          # 0.17.1 statically links mbedtls and needs no OpenSSL at link time.
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_34"
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_34"
          - os: macos-latest
            target: aarch64
            manylinux: "off"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache lbug prebuilt
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/lbug-prebuilt
          key: lbug-prebuilt-0.17.1-static-${{ runner.os }}-${{ runner.arch }}

      - name: Setup lbug prebuilt
        if: runner.os == 'macOS'
        run: ./scripts/setup-lbug-prebuilt.sh

      # lbug 0.17.1 statically links mbedtls and needs no OpenSSL. cmake and a
      # deployment target new enough for C++ `to_chars` (macOS 13.3+) are still
      # needed for source fallbacks.
      - name: Install macOS build deps (lbug)
        if: runner.os == 'macOS'
        run: |
          brew install cmake
          echo "MACOSX_DEPLOYMENT_TARGET=13.3" >> "$GITHUB_ENV"

      - name: Build bin wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # Install cmake inside the manylinux container (host packages are invisible).
          before-script-linux: |
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y --disablerepo='epel*' cmake pkgconfig
            elif command -v yum >/dev/null 2>&1; then
              yum install -y --disablerepo='epel*' cmake pkgconfig
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                cmake pkg-config
            else
              echo "No supported package manager in manylinux container" >&2
              exit 1
            fi
          args: >-
            --release --bindings bin
            --manifest-path topos/mcp/Cargo.toml
            --out dist

      # Guard against non-portable dylib paths in the wheel binary. v0.4.1
      # wheels linked Homebrew openssl@3 and failed on machines without it.
      # Linux wheels are covered by auditwheel; macOS has no equivalent.
      - name: Verify macOS wheel binary has no non-system linkage
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          # Guard the glob: with `set -e` an unexpanded dist/*.whl would abort
          # here with a confusing unzip error instead of the message below.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error title=No wheel built::dist/ contains no .whl"
            exit 1
          fi
          for whl in "${wheels[@]}"; do
            unzip -qo "${whl}" -d "${workdir}"
          done
          # Redirect from a file, not a here-doc: a here-doc body must start at
          # column 1, which would break out of this YAML block scalar.
          find "${workdir}" -type f -path '*.data/scripts/*' > "${workdir}/bins.txt"
          found=0
          while IFS= read -r bin; do
            [ -n "${bin}" ] || continue
            found=1
            echo "checking ${bin}"
            bad="$(otool -L "${bin}" | tail -n +2 \
              | grep -vE '^[[:space:]]+(/usr/lib/|/System/)' || true)"
            if [ -n "${bad}" ]; then
              echo "::error title=Non-portable macOS wheel::${bin} links non-system libraries"
              echo "${bad}"
              exit 1
            fi
          done < "${workdir}/bins.txt"
          if [ "${found}" -eq 0 ]; then
            echo "::error title=Wheel check found no binary::expected a *.data/scripts/ entry"
            exit 1
          fi

      # auditwheel only rejects a non-allowlisted libssl if it runs; nothing
      # here proves it did. Check the DT_NEEDED entries directly so removing
      # openssl-devel from this job is actually demonstrated, not assumed.
      - name: Verify Linux wheel binary has no unexpected linkage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error title=No wheel built::dist/ contains no .whl"
            exit 1
          fi
          for whl in "${wheels[@]}"; do
            unzip -qo "${whl}" -d "${workdir}"
          done
          find "${workdir}" -type f -path '*.data/scripts/*' > "${workdir}/bins.txt"
          found=0
          while IFS= read -r bin; do
            [ -n "${bin}" ] || continue
            found=1
            echo "checking ${bin}"
            bad="$(readelf -d "${bin}" \
              | grep 'NEEDED' \
              | grep -vE 'lib(c|m|dl|pthread|rt|gcc_s|stdc\+\+)\.so|ld-linux-[a-z0-9_-]*\.so' || true)"
            if [ -n "${bad}" ]; then
              echo "::error title=Non-portable Linux wheel::${bin} has unexpected DT_NEEDED entries"
              echo "${bad}"
              exit 1
            fi
            readelf -d "${bin}" | grep 'NEEDED'
          done < "${workdir}/bins.txt"
          if [ "${found}" -eq 0 ]; then
            echo "::error title=Wheel check found no binary::expected a *.data/scripts/ entry"
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish-pypi:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - build-pypi-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      # Preflight so skip-existing is visible in the Actions UI. Twine only
      # prints "Skipping … already exist" inside the publish action logs;
      # notices + job summary make reruns obvious to reviewers.
      - name: Classify wheels already on PyPI
        id: pypi_preflight
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl dist/*.tar.gz)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error title=No PyPI artifacts::dist/ has no .whl/.tar.gz to publish"
            exit 1
          fi

          # stdout → job summary; stderr → log + workflow commands (::notice).
          python3 -u <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          def notice(title: str, message: str) -> None:
              # Workflow commands must be full lines on the runner log stream.
              print(f"::notice title={title}::{message}", file=sys.stderr, flush=True)

          def error(title: str, message: str) -> None:
              print(f"::error title={title}::{message}", file=sys.stderr, flush=True)

          dist = Path("dist")
          artifacts = sorted(
              [p for p in dist.iterdir() if p.suffix == ".whl" or p.name.endswith(".tar.gz")],
              key=lambda p: p.name,
          )
          if not artifacts:
              error("No PyPI artifacts", "dist/ has no .whl/.tar.gz")
              sys.exit(1)

          # maturin bin wheels: topos_mcp-0.4.3-py3-none-....whl
          version = None
          for path in artifacts:
              m = re.match(r"topos_mcp-([0-9][^-\s]+)-", path.name)
              if m:
                  version = m.group(1)
                  break
          if version is None:
              error("Could not parse wheel version", "expected topos_mcp-<version>-*.whl")
              sys.exit(1)

          project = "topos-mcp"
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          existing: set[str] = set()
          try:
              with urllib.request.urlopen(url, timeout=30) as resp:
                  payload = json.load(resp)
              existing = {item["filename"] for item in payload.get("urls", [])}
              print(f"### PyPI preflight (`{project}=={version}`)")
              print()
              print(f"Found **{len(existing)}** file(s) already on the index for this version.")
          except urllib.error.HTTPError as err:
              if err.code == 404:
                  print(f"### PyPI preflight (`{project}=={version}`)")
                  print()
                  print("Version not on PyPI yet (404) — all local artifacts are new.")
              else:
                  raise

          already = []
          missing = []
          print()
          print("| Artifact | Before publish |")
          print("| --- | --- |")
          for path in artifacts:
              if path.name in existing:
                  already.append(path.name)
                  print(f"| `{path.name}` | already on index |")
                  notice("PyPI will skip (already on index)", path.name)
              else:
                  missing.append(path.name)
                  print(f"| `{path.name}` | will upload |")
                  notice("PyPI will upload", path.name)

          print()
          print(
              f"**Preflight:** {len(missing)} to upload, "
              f"{len(already)} already on index (skip-existing)."
          )
          notice(
              "PyPI preflight",
              f"{len(missing)} to upload, {len(already)} already on index",
          )

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"already_count={len(already)}\n")
              fh.write(f"upload_count={len(missing)}\n")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Official input → twine --skip-existing. Needed for release reruns
          # / partial multi-wheel uploads. Default is false.
          skip-existing: true

      - name: Summarize PyPI publish
        if: ${{ always() && steps.pypi_preflight.outcome == 'success' }}
        env:
          PRE_ALREADY: ${{ steps.pypi_preflight.outputs.already_count }}
          PRE_UPLOAD: ${{ steps.pypi_preflight.outputs.upload_count }}
          VERSION: ${{ steps.pypi_preflight.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### PyPI publish result (`topos-mcp==${VERSION}`)"
            echo ""
            echo "Used \`skip-existing: true\`. Preflight classification:"
            echo ""
            echo "- **${PRE_UPLOAD}** artifact(s) not on the index before this job (upload attempted)"
            echo "- **${PRE_ALREADY}** artifact(s) already on the index (twine skips these)"
            echo ""
            echo "Twine also logs \`Skipping <file> because it appears to already exist\` inside the Publish step when a duplicate is hit."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=PyPI publish finished::topos-mcp==${VERSION}: ${PRE_UPLOAD} attempted upload(s), ${PRE_ALREADY} pre-existing skip(s)"




  publish-mcp-registry:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate .mcp/server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish .mcp/server.json
