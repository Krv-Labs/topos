name: CI

on:
  push:
    branches: [main, worktree-rust-migration-v0.4.0]
  # Deliberately unfiltered. `branches:` filters on a PR's *base*, and a stacked
  # PR targets its parent topic branch — so the old allowlist
  # ([main, worktree-rust-migration-v0.4.0, 'release/**']) excluded every
  # stacked PR from CI entirely, leaving stacked changes reviewed with no
  # verification behind them. The policy moved into the `gate` job below, which
  # mirrors that allowlist and additionally admits PRs that belong to a GitHub
  # stack. `scripts/ci_gate.py` owns the decision; TRUNK_PATTERNS there must
  # stay in sync with `on.push.branches` above.
  pull_request:

jobs:
  # Decides whether the rest of the workflow runs. Trunk-targeted PRs are
  # admitted without consulting the stack API at all, so the critical path to
  # `main` gains no new dependency; only topic-branch PRs are asked whether
  # they are stacked.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the gate's own decision table
        run: python3 scripts/ci_gate.py --selftest

      # `PullRequestStack` is a new API and whether an Actions installation
      # token can read it is exactly what this step establishes. The raw
      # response is printed — `errors` array included — so a single run answers
      # that, and the step never fails: an unreadable response has to fail open
      # in `ci_gate.py`, not block CI here.
      - name: Query stack membership
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2016  # $owner/$name/$number are GraphQL
          # variables and must reach the API unexpanded; the shell must not
          # touch them. Real values are bound by the -F flags below.
          gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){number baseRefName stack{number size}}}}' \
            -F owner="$OWNER" -F name="$NAME" -F number="$NUMBER" \
            > stack.json 2> stack.err || true
          echo "--- raw GraphQL response ---"
          cat stack.json || true
          echo "--- stderr ---"
          cat stack.err || true

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 scripts/ci_gate.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --stack-response stack.json

  rust:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps (lbug / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Clippy and the test suite link topos-engine, so this job needs liblbug
      # just as much as `composable` does. Without it, a cold cargo cache fails
      # at link time with "could not find native static library `lbug`".
      # See scripts/setup-lbug-prebuilt.sh and issue #239.
      #
      # This runs *before* the cargo cache is restored, so `LBUG_LIBRARY_DIR`
      # is already exported when `rust-cache` computes its key. That matters:
      # lbug's build script only emits `-L` when that variable is set, and it
      # registers no `rerun-if-env-changed` for it, so a `target/` restored
      # from a run without the variable keeps stale build-script output and
      # fails to link no matter what the environment now says.
      - name: Cache lbug prebuilt
        uses: actions/cache@v4
        with:
          path: ~/.cargo/lbug-prebuilt
          key: lbug-prebuilt-0.17.1-static-${{ runner.os }}-${{ runner.arch }}

      - name: Setup lbug prebuilt
        run: ./scripts/setup-lbug-prebuilt.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keys caches to how lbug was provisioned, so one built without it is
          # never restored into a job that needs it.
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LBUG_LIBRARY_DIR

      - name: Check versions (Cargo.toml is source of truth)
        run: python3 scripts/check_versions.py

      - name: Check agent skills
        run: python3 scripts/check_skill.py

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Smoke-test the MCP server over stdio
        run: |
          cargo build -p topos-mcp --bin topos-mcp
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | TOPOS_MCP_FILE_ROOT="$PWD" ./target/debug/topos-mcp \
          | grep -q '"topos_evaluate_code"'

  composable:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps (lbug / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache lbug prebuilt
        uses: actions/cache@v4
        with:
          path: ~/.cargo/lbug-prebuilt
          key: lbug-prebuilt-0.17.1-static-${{ runner.os }}-${{ runner.arch }}

      - name: Setup lbug prebuilt
        run: ./scripts/setup-lbug-prebuilt.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned GitNexus
        run: npm install -g gitnexus@1.6.8

      - name: Build topos CLI
        run: cargo build -p topos --bin topos

      - name: Analyze fixture and assert COMPOSABLE scores
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/target/debug/topos"
          FIXTURE_SRC="$GITHUB_WORKSPACE/tests/fixtures/composable_mdg"
          WORK="$(mktemp -d)"
          cp -R "$FIXTURE_SRC/." "$WORK/"
          cd "$WORK"
          git init
          git config user.email "ci@topos.local"
          git config user.name "topos-ci"
          git add -A
          git commit -m "fixture"
          gitnexus analyze --skip-agents-md
          test -f .gitnexus/lbug
          test ! -d .gitnexus/lbug
          OUT="$(mktemp)"
          ERR="$(mktemp)"
          "$BIN" evaluate --language rust src/lib.rs --json >"$OUT" 2>"$ERR"
          echo "=== stdout ==="
          cat "$OUT"
          echo "=== stderr ==="
          cat "$ERR"
          if grep -q "no indexed store found" "$ERR"; then
            echo "COMPOSABLE silently fell back to no-store messaging" >&2
            exit 1
          fi
          if ! jq -e '.results[0].scores.composable != null' "$OUT" >/dev/null; then
            echo "COMPOSABLE pillar missing from evaluate output" >&2
            exit 1
          fi

  wheel:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the topos-mcp bin wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2_34"
          # manylinux_2_34 (AlmaLinux 9) ships OpenSSL 3 — required by the
          # lbug prebuilt. Building on the host ubuntu-latest linker pulls in
          # a second copy of antlr4 (duplicate symbols with liblbug.a).
          before-script-linux: |
            if command -v dnf >/dev/null 2>&1; then
              # openssl-devel/cmake live in base/AppStream; skip EPEL to avoid mirror flakes.
              dnf install -y --disablerepo='epel*' openssl-devel cmake pkgconfig
            elif command -v yum >/dev/null 2>&1; then
              yum install -y --disablerepo='epel*' openssl-devel cmake pkgconfig
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libssl-dev cmake pkg-config
            else
              echo "No supported package manager in manylinux container" >&2
              exit 1
            fi
          args: --release --bindings bin --manifest-path topos/mcp/Cargo.toml --out dist

  extension:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extensions/vscode/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: extensions/vscode
        run: pnpm run check-types

      - name: Lint
        working-directory: extensions/vscode
        run: pnpm run lint

      - name: Unit tests
        working-directory: extensions/vscode
        run: pnpm run test:unit
